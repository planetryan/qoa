# fitxategi honek QOA egiaztatzen du push eta pull request bakoitzean:
#   - formatua eta clippy (vulkan-ekin eta gabe), abisurik gabe
#   - rust 1.89 (Cargo.toml-eko rust-version) konpilatzen dela
#   - proba guztiak linux, windows eta macos-en (macos: arm64, NEON kernelak natiboan); linux-en GPU probak
#     lavapipe-rekin (software bidezko vulkan), eta QOA_REQUIRE_GPU=1 saltatu ez daitezen
#   - ARM64 eta RISC-V (RVV, bi bektore-luzera) qemu-n: SIMD, kernel, erreferentzia eta GPU-planaren probak, eta
#     128 biteko motorrak bit berak ematen dituela arkitektura guztietan
#   - MPI: open mpi eta mpich liburutegiekin (exekuzioan kargatuak, QOA_MPI_LIB), 3 prozesuk prozesu batek
#     bezalako zenbaketak ematen dituztela; egoera banatua (2 eta 4 prozesu, eta OpenCL gailuekin POCL-en)
#   - OpenCL gailua (POCL) CPUaren aurka, QOA_REQUIRE_OPENCL=1
#   - abiarazleak (run.sh, run.ps1, run.cmd)
#   - proba guztiak gainezkatze-egiaztapenekin, eta menpekotasunak RustSec-en aholkuen aurka
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo clippy --release --locked --no-default-features --all-targets -- -D warnings

  msrv:
    name: rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked

  mpi:
    name: mpi (open mpi and mpich, 2-4 processes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: mpi
      # QOA-k ez du MPI-rik behar konpilatzeko; hemen exekutatzeko bakarrik, bi familiekin
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin mpich pocl-opencl-icd ocl-icd-libopencl1
      - run: cargo clippy --release --locked --features mpi --all-targets -- -D warnings
      - run: cargo build --release --locked
      # liburutegi bakoitzarekin dabilen abiarazlea: open mpi-rena berea; mpich-ena bere hydra edo open mpi-ren
      # mpirun (PMIx bidez), banaketaren arabera. bi prozesuk txosten bakarra eman behar dute
      - name: find a launcher for each MPI library
        run: |
          for pair in "libmpi.so.40|mpirun.openmpi --oversubscribe -x QOA_MPI_LIB" \
                      "libmpich.so.12|mpiexec.mpich" \
                      "libmpich.so.12|mpirun.openmpi --oversubscribe -x QOA_MPI_LIB"; do
            lib=${pair%%|*}; launcher=${pair#*|}
            grep -q "^$lib|" launchers.txt 2>/dev/null && continue
            n=$(QOA_MPI_LIB=$lib timeout 60 $launcher -n 2 ./target/release/qoa run examples/bell.qoa --mpi --shots 10 --json 2>/dev/null | grep -c '"counts"' || true)
            if [ "$n" = 1 ]; then echo "$lib|$launcher" >> launchers.txt; fi
          done
          cat launchers.txt
          test "$(cut -d'|' -f1 launchers.txt | sort -u | wc -l)" = 2
      - name: shots over 3 processes give the same counts as one
        run: |
          while IFS='|' read -r lib launcher; do
            export QOA_MPI_LIB=$lib
            for args in "examples/grover.qoa --shots 5000" "examples/retry.qoa --shots 3000" "examples/teleport.qoa --noise 0.02 --shots 3000"; do
              ./target/release/qoa run $args --seed 3 --json | jq -c '.counts' > one.json
              $launcher -n 3 ./target/release/qoa run $args --mpi --seed 3 --json | jq -c '.counts' > three.json
              diff one.json three.json
            done
          done < launchers.txt
      - name: one state split over 2 and 4 processes gives the same counts
        run: |
          while IFS='|' read -r lib launcher; do
            export QOA_MPI_LIB=$lib
            for n in 2 4; do
              for args in "examples/grover.qoa --shots 5000" "examples/qpe.qoa --shots 2000" "examples/teleport.qoa --noise 0.02 --shots 400"; do
                ./target/release/qoa run $args --seed 3 --json | jq -c '.counts' > one.json
                $launcher -n $n ./target/release/qoa run $args --mpi --distribute --seed 3 --json | jq -c '.counts' > many.json
                diff one.json many.json
              done
            done
          done < launchers.txt
      - name: one state over 2 processes, each on an OpenCL device
        run: |
          ./target/release/qoa run examples/qpe.qoa --seed 3 --json | jq -c '.counts' > one.json
          mpirun.openmpi --oversubscribe -n 2 ./target/release/qoa run examples/qpe.qoa --mpi --distribute --gpu-api opencl --seed 3 --json | jq -c '.counts' > two.json
          diff one.json two.json
      - name: input read by process 0 reaches every process
        run: |
          printf 'QINIT 2\nINPUT R1\nREGSET R2 0.5\nH q0\nMEASURE q0 -> c0\nIFGT R1 R2 flip\nJUMP done\nflip:\nX q1\ndone:\nMEASURE q1 -> c1\n' > input.qoa
          while IFS='|' read -r lib launcher; do
            export QOA_MPI_LIB=$lib
            echo 0.7 | ./target/release/qoa run input.qoa --seed 5 --shots 600 --json | jq -c '.counts' > one.json
            echo 0.7 | $launcher -n 3 ./target/release/qoa run input.qoa --mpi --seed 5 --shots 600 --json | jq -c '.counts' > three.json
            diff one.json three.json
          done < launchers.txt
      - name: an unknown or missing MPI library is a clear error
        run: |
          ! QOA_MPI_LIB=libnothing.so ./target/release/qoa run examples/bell.qoa --mpi 2> err.txt
          grep -q "no MPI library found" err.txt

  # menpekotasunak RustSec-en aholkuen aurka (ahultasun ezagunak, mantendu gabeko crate-ak): Cargo.lock-eko
  # bertsio zehatzak
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit
      # ahultasunek huts eginarazten dute; mantendu gabeko crate-ak abisu gisa erakusten dira
      - run: cargo audit

  # proba-multzo osoa zenbaki osoen gainezkatze-egiaztapenekin eta debug_assert-ekin: argitalpenean (azkarrago
  # izateko) isilik bilduko litzatekeen gainezkatze oro hemen huts egite bat da, eraso-proba barne
  overflow:
    name: tests with overflow checks
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: overflow
      - run: cargo test --release --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: lavapipe (software vulkan), pocl (cpu opencl) and ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers pocl-opencl-icd ocl-icd-libopencl1 ffmpeg
      - name: test
        run: cargo test --release --locked
        env:
          QOA_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
          QOA_REQUIRE_OPENCL: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: run.sh
        if: runner.os != 'Windows'
        run: ./run.sh run examples/bell.qoa --seed 1
      - name: run.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./run.ps1 run examples/bell.qoa --seed 1
      - name: run.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: run.cmd run examples\bell.qoa --seed 1

  qemu:
    name: test ${{ matrix.name }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64 neon
            target: aarch64-unknown-linux-gnu
            packages: qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - name: riscv64 rvv vlen 128
            target: riscv64gc-unknown-linux-gnu
            packages: qemu-user gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
            vlen: 128
          - name: riscv64 rvv vlen 512
            target: riscv64gc-unknown-linux-gnu
            packages: qemu-user gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
            vlen: 512
          - name: ppc64le power10
            target: powerpc64le-unknown-linux-gnu
            packages: qemu-user gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
          - name: aarch64 static musl
            target: aarch64-unknown-linux-musl
            packages: qemu-user gcc-aarch64-linux-gnu
          - name: s390x big-endian
            target: s390x-unknown-linux-gnu
            packages: qemu-user gcc-s390x-linux-gnu libc6-dev-s390x-cross
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: test
        run: >
          cargo test --release --locked --target ${{ matrix.target }}
          --test simd --test kernel --test reference --test optics --test gpu --test dd --test noise --test quad
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu max -L /usr/aarch64-linux-gnu
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          # ubuntu 26.04-ren riscv64 libc-ak RVA23 profila erabiltzen du: `max` cpu-ak luzapen guztiak ditu
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -cpu max,vlen=${{ matrix.vlen || 128 }} -L /usr/riscv64-linux-gnu
          CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER: powerpc64le-linux-gnu-gcc
          CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_RUNNER: qemu-ppc64le -cpu power10 -L /usr/powerpc64le-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64 -cpu max
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
