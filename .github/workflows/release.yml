# fitxategi honek QOA-ren bitarrak konpilatzen ditu sistema eta arkitektura guztietarako, eta `v*` etiketa
# batean (adib. v0.4.0) GitHub argitalpen bat sortzen du haiekin:
#
#   qoa-<bertsioa>-<helburua>.zip / .tar.gz   helburu bakoitzeko: qoa edo qoa.exe, abiarazlea, adibideak eta
#                                             tools/asm.qoa (QOAn idatzitako mihiztatzailea)
#   qoa-<bertsioa>-all.zip                    guztiak batera: bin/<helburua>/, run.sh, run.ps1, run.cmd
#   SHA256SUMS                                fitxategi guztien laburpenak
#
# helburuak (64 bitekoak bakarrik: simulazioak 64 biteko koma higikorra behar du):
#   linux glibc: x86_64, aarch64, riscv64gc, powerpc64le (IBM POWER8 eta berriagoak), s390x (IBM Z),
#                loongarch64 (glibc 2.36+, ubuntu 24.04-n konpilatua)
#   linux estatikoa (musl): x86_64, aarch64 (android/termux barne), riscv64gc
#   windows: x86_64, aarch64       macos: x86_64, aarch64
# linux-ekoak ubuntu 22.04-n konpilatzen dira (glibc 2.35), banaketa zaharragoetan ere ibil daitezen.
# pull request batean (fitxategi hau, abiarazleak edo Cargo aldatzen badira) eta eskuz ere exekutatzen da,
# argitaratu gabe: konpilazioa eta paketeak egiaztatzeko.
#
# eskuz argitaratzea (Actions fitxa, edo GitHub-en aplikazioa telefonoan): "Run workflow" main adarrean,
# `release` eremuan bertsioa (adib. v0.4.1). konpilatu eta probatu ondoren, workflow-ak berak sortzen ditu
# etiketa eta argitalpena commit horretan; ez da git-ik behar.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - run.sh
      - run.ps1
      - run.cmd
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      release:
        description: "publish a release with this version tag, e.g. v0.4.1 (main only; empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # eskuz eskatutako bertsioa (hutsik gainerako kasuetan)
  RELEASE_TAG: ${{ github.event.inputs.release || '' }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, run: "" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, packages: gcc-aarch64-linux-gnu qemu-user, run: "qemu-aarch64 -L /usr/aarch64-linux-gnu" }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-22.04, packages: gcc-riscv64-linux-gnu qemu-user, run: "qemu-riscv64 -L /usr/riscv64-linux-gnu" }
          - { target: powerpc64le-unknown-linux-gnu, os: ubuntu-22.04, packages: gcc-powerpc64le-linux-gnu qemu-user, run: "qemu-ppc64le -cpu power8 -L /usr/powerpc64le-linux-gnu" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, packages: gcc-aarch64-linux-gnu qemu-user, run: "qemu-aarch64" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, run: "" }
          - { target: riscv64gc-unknown-linux-musl, os: ubuntu-22.04, packages: gcc-riscv64-linux-gnu qemu-user, run: "qemu-riscv64" }
          - { target: s390x-unknown-linux-gnu, os: ubuntu-22.04, packages: gcc-s390x-linux-gnu qemu-user, run: "qemu-s390x -L /usr/s390x-linux-gnu" }
          - { target: loongarch64-unknown-linux-gnu, os: ubuntu-24.04, packages: gcc-13-loongarch64-linux-gnu qemu-user, run: "qemu-loongarch64 -L /usr/loongarch64-linux-gnu" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: "" }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest, run: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross toolchain
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER: powerpc64le-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: riscv64-linux-gnu-gcc
          # riscv64 musl ez da lehenetsiz estatikoa, eta rust-en libc.a bere horretan erabili behar da
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
          CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER: loongarch64-linux-gnu-gcc-13
      - name: package
        id: package
        shell: bash
        run: |
          case "${{ matrix.target }}" in *windows*) exe=qoa.exe ;; *) exe=qoa ;; esac
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; elif [ -n "$RELEASE_TAG" ]; then version="$RELEASE_TAG"; else version="dev-${GITHUB_SHA::7}"; fi
          name="qoa-$version-${{ matrix.target }}"
          mkdir -p "dist/$name" "bin/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp "target/${{ matrix.target }}/release/$exe" "bin/${{ matrix.target }}/"
          cp README.md README.eu.md LICENSE "dist/$name/"
          cp -r examples "dist/$name/"
          mkdir -p "dist/$name/tools" && cp tools/asm.qoa "dist/$name/tools/"
          case "${{ matrix.target }}" in
            *windows*) cp run.ps1 run.cmd "dist/$name/"; (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null) ;;
            *) cp run.sh "dist/$name/"; tar -C dist -czf "dist/$name.tar.gz" "$name" ;;
          esac
          rm -r "dist/$name"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      - name: check the binary runs
        if: matrix.run != null
        shell: bash
        run: |
          ${{ matrix.run }} "bin/${{ matrix.target }}/${{ steps.package.outputs.exe }}" --version
          ${{ matrix.run }} "bin/${{ matrix.target }}/${{ steps.package.outputs.exe }}" run examples/bell.qoa --seed 1
          # QOA-k QOA eraikitzen du makina honetan ere: rust-ek eraikitako mihiztatzaileak bere burua berdin eraikitzen du
          q="${{ matrix.run }} bin/${{ matrix.target }}/${{ steps.package.outputs.exe }}"
          $q compile tools/asm.qoa -o stage1.qx
          $q compile --assembler stage1.qx tools/asm.qoa -o stage2.qx
          cmp stage1.qx stage2.qx
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/
            bin/

  bundle:
    name: all-platform bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - name: bundle and checksums
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; elif [ -n "$RELEASE_TAG" ]; then version="$RELEASE_TAG"; else version="dev-${GITHUB_SHA::7}"; fi
          name="qoa-$version-all"
          mkdir -p "$name"
          cp -r bin "$name/"
          chmod +x "$name"/bin/*/qoa || true
          cp run.sh run.ps1 run.cmd README.md README.eu.md LICENSE "$name/"
          cp -r examples "$name/"
          mkdir -p "$name/tools" && cp tools/asm.qoa "$name/tools/"
          zip -qr "dist/$name.zip" "$name"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/

  # pakete osoa sistema bakoitzean: abiarazleak makina horren bitarra aurkitzen eta exekutatzen dutela
  try:
    name: bundle on ${{ matrix.os }}
    needs: bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: unpack
        shell: bash
        run: unzip -q qoa-*-all.zip && mv qoa-*-all bundle
      - name: run.sh
        if: runner.os != 'Windows'
        run: |
          cd bundle && ./run.sh run examples/bell.qoa --seed 1
          ./run.sh compile --assembler tools/asm.qoa examples/bell.qoa -o bell-qoa.qx
          ./run.sh compile examples/bell.qoa -o bell-rust.qx
          cmp bell-qoa.qx bell-rust.qx
      - name: run.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: cd bundle; ./run.ps1 run examples/bell.qoa --seed 1
      - name: run.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: cd bundle && run.cmd run examples\bell.qoa --seed 1

  publish:
    name: publish the release
    needs: [bundle, try]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: the tag must match Cargo.toml
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="$RELEASE_TAG"; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'$tag' is not a version tag like v0.4.0"; exit 1
          fi
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$want" ]; then
            echo "tag $tag, but Cargo.toml says $want"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # etiketa git bidez sortzen da (ez github-ek alferki argitaratzean), eta argitalpen bat lehendik badago
      # (zirriborro gisa, adibidez etiketa ezabatu zelako), osatu eta argitaratu egiten da
      - name: tag the commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "tag $TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: create or finish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="changelog/QOA $TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --draft=false --title "QOA $TAG" --notes-file "$notes"
            else
              gh release edit "$TAG" --draft=false --title "QOA $TAG"
            fi
          else
            if [ -f "$notes" ]; then flag=(--notes-file "$notes"); else flag=(--generate-notes); fi
            gh release create "$TAG" dist/* --verify-tag --title "QOA $TAG" "${flag[@]}"
          fi
      - name: the release must be published, with its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json tagName,isDraft,url,assets --jq '"\(.url) draft=\(.isDraft) assets=\(.assets | length)"'
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          git ls-remote --exit-code --tags origin "refs/tags/$TAG"
