# fitxategi honek argitalpen zaharrak berreskuratzen ditu, beren etiketa galdu zutelako zirriborro bihurtu badira
# (GitHub-ek argitaratutako argitalpen bat etiketarik gabeko zirriborro bihurtzen du haren etiketa ezabatzean,
# eta zirriborroak zerrendaren goian erakusten ditu). argitalpenak zahar gisa argitaratzen dira, "Latest" izan
# gabe, zaharrenetik hasita: bertsio berrienak jarraitzen du "Latest" izaten. fitxategiak argitalpenak lehendik
# dituenak dira; ez da ezer konpilatzen.
#
# github-ek ez dio uzten ekintza honi etiketa bat sortzen workflow fitxategiak main-ekoak ez dituen commit
# batean ("workflows" baimenik gabe, ez git bidez ez argitalpenaren bidez). orduan etiketa behin eskuz bidali
# behar da, eta gero hau exekutatu:
#
#   git push origin <commit>:refs/tags/<etiketa>
#
# eskuz: Actions fitxa, "restore release". etiketarik gabe, etiketa duten zirriborro guztiak berreskuratzen
# ditu; etiketa eta commit-arekin, hori bakarrik (eta etiketa sortzen saiatzen da).
name: restore release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag of one draft release, e.g. v0.4.1 (empty = every draft whose tag exists)"
        required: false
        default: ""
      commit:
        description: "commit that release was built from (only with a tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
      COMMIT: ${{ github.event.inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the releases to restore
        run: |
          # bertsio bakoitzaren commit-a: etiketarena, Cargo.toml-en bertsioarekin bat etorri behar duena
          version_of() { echo "v$(git show "$1:Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)"; }
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "'$TAG' is not a version tag like v0.4.1"; exit 1; fi
            if [ -z "$COMMIT" ]; then COMMIT="$TAG"; fi
            sha=$(git rev-parse --verify "$COMMIT^{commit}")
            if [ "$(version_of "$sha")" != "$TAG" ]; then echo "$COMMIT is $(version_of "$sha"), not $TAG"; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              test "$(git rev-parse "$TAG^{commit}")" = "$sha" || { echo "tag $TAG points elsewhere"; exit 1; }
            elif ! { git tag "$TAG" "$sha" && git push origin "refs/tags/$TAG"; }; then
              echo "GitHub does not let this workflow create tag $TAG at an older commit."
              echo "Push it once with your own account, then run this workflow again:"
              echo "  git push origin $sha:refs/tags/$TAG"
              exit 1
            fi
            echo "$TAG" > restore.txt
          else
            : > restore.txt
            missing=0
            for t in $(gh release list --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V); do
              if git rev-parse --verify -q "refs/tags/$t^{commit}" > /dev/null; then
                if [ "$(version_of "$t")" != "$t" ]; then echo "tag $t is at $(version_of "$t"); skipped"; continue; fi
                echo "$t" >> restore.txt
              else
                echo "draft $t has no tag; push it once with your own account, then run this again:"
                echo "  git push origin <commit of $t>:refs/tags/$t"
                missing=1
              fi
            done
            if [ ! -s restore.txt ]; then echo "nothing to restore"; exit "$missing"; fi
          fi
          echo "restoring: $(tr '\n' ' ' < restore.txt)"
      - name: publish them as older releases, and keep the newest version as latest
        run: |
          for t in $(cat restore.txt); do
            gh release edit "$t" --draft=false --latest=false --tag "$t"
            test "$(gh release view "$t" --json isDraft --jq .isDraft)" = "false"
            gh release view "$t" --json tagName,isDraft,assets --jq '"\(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'
          done
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          gh release edit "$newest" --latest
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "latest: $latest"
          test "$latest" = "$newest"
