# fitxategi honek argitalpen zahar bat berreskuratzen du, bere etiketa galdu zuelako zirriborro bihurtu bada
# (GitHub-ek argitaratutako argitalpen bat etiketarik gabeko zirriborro bihurtzen du haren etiketa ezabatzean,
# eta zirriborroak zerrendaren goian erakusten ditu). etiketa jatorrizko commit-ean sortzen da berriz, eta
# argitalpena zahar gisa argitaratzen da, "Latest" izan gabe: bertsio berrienak jarraitzen du "Latest"
# izaten. fitxategiak argitalpenak lehendik dituenak dira; ez da ezer konpilatzen.
#
# eskuz: Actions fitxa, "restore release", etiketa (adib. v0.4.1) eta haren commit-a.
name: restore release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag of the draft release, e.g. v0.4.1"
        required: true
      commit:
        description: "commit the release was built from"
        required: true

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
      COMMIT: ${{ github.event.inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the commit is that version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "'$TAG' is not a version tag like v0.4.1"; exit 1; fi
          sha=$(git rev-parse --verify "$COMMIT^{commit}")
          want="v$(git show "$sha:Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)"
          if [ "$want" != "$TAG" ]; then echo "$COMMIT is $want, not $TAG"; exit 1; fi
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - name: tag it again
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "tag $TAG already exists"
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: publish it as an older release, and keep the newest version as latest
        run: |
          gh release edit "$TAG" --draft=false --latest=false --tag "$TAG"
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          gh release edit "$newest" --latest
          gh release view "$TAG" --json tagName,isDraft,assets --jq '"\(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "latest: $latest"
          test "$latest" = "$newest"
