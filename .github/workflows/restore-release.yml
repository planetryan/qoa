# fitxategi honek argitalpen zaharrak berreskuratzen ditu, beren etiketa galdu zutelako zirriborro bihurtu badira
# (GitHub-ek argitaratutako argitalpen bat etiketarik gabeko zirriborro bihurtzen du haren etiketa ezabatzean,
# eta zirriborroak zerrendaren goian erakusten ditu). argitalpenak zahar gisa argitaratzen dira, "Latest" izan
# gabe, zaharrenetik hasita: bertsio berrienak jarraitzen du "Latest" izaten. fitxategiak argitalpenak lehendik
# dituenak dira; ez da ezer konpilatzen.
#
# github-ek ez dio uzten ekintza honen token arruntari etiketa bat sortzen workflow fitxategiak main-ekoak ez
# dituen commit batean. horretarako QOA_RELEASE_TOKEN sekretua erabiltzen da badago: biltegi honetarako
# bakarrik den token fin bat, "Contents" eta "Workflows" idazteko baimenekin (telefonotik ere sor daiteke, eta
# erabili ondoren ezeztatu). bestela, etiketa eskuz bidali behar da:
#
#   git push origin <commit>:refs/tags/<etiketa>
#
# eskuz: Actions fitxa, "restore release". `tags` hutsik: etiketa duten zirriborro guztiak; bestela
# "v0.4.0=e56b00f v0.4.1=3dbed9e" bezalako zerrenda: etiketa bakoitza bere commit-ean sortu eta argitaratu.
name: restore release

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "tag=commit pairs to recreate and publish, e.g. \"v0.4.0=e56b00f v0.4.1=3dbed9e\" (empty = every draft whose tag exists)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      TAGS: ${{ github.event.inputs.tags }}
      GH_TOKEN: ${{ github.token }}
      HAS_RELEASE_TOKEN: ${{ secrets.QOA_RELEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # etiketak bidaltzeko: sekretua badago hura (workflow baimenarekin), bestela token arrunta
          token: ${{ secrets.QOA_RELEASE_TOKEN || github.token }}
      - name: the releases to restore
        run: |
          # bertsio bakoitzaren commit-a: Cargo.toml-en bertsioarekin bat etorri behar da
          version_of() { echo "v$(git show "$1:Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)"; }
          : > restore.txt
          if [ -n "$TAGS" ]; then
            for pair in $TAGS; do
              tag=${pair%%=*}; commit=${pair#*=}
              if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$tag" = "$pair" ]; then
                echo "'$pair' is not a pair like v0.4.1=3dbed9e"; exit 1
              fi
              sha=$(git rev-parse --verify "$commit^{commit}")
              if [ "$(version_of "$sha")" != "$tag" ]; then echo "$commit is $(version_of "$sha"), not $tag"; exit 1; fi
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
                git fetch -q origin "refs/tags/$tag:refs/tags/$tag"
                test "$(git rev-parse "$tag^{commit}")" = "$sha" || { echo "tag $tag points elsewhere"; exit 1; }
              elif ! { git tag "$tag" "$sha" && git push origin "refs/tags/$tag"; }; then
                echo "GitHub does not let this workflow's token create tag $tag at an older commit."
                if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
                  echo "Add a QOA_RELEASE_TOKEN secret (a fine-grained token for this repository with Contents and"
                  echo "Workflows write), or push the tag once with your own account:"
                fi
                echo "  git push origin $sha:refs/tags/$tag"
                exit 1
              fi
              echo "$tag" >> restore.txt
            done
          else
            missing=0
            for t in $(gh release list --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V); do
              if git rev-parse --verify -q "refs/tags/$t^{commit}" > /dev/null; then
                if [ "$(version_of "$t")" != "$t" ]; then echo "tag $t is at $(version_of "$t"); skipped"; continue; fi
                echo "$t" >> restore.txt
              else
                echo "draft $t has no tag; give it as tags: \"$t=<commit>\""
                missing=1
              fi
            done
            if [ ! -s restore.txt ]; then echo "nothing to restore"; exit "$missing"; fi
          fi
          sort -V -o restore.txt restore.txt
          echo "restoring: $(tr '\n' ' ' < restore.txt)"
      - name: publish them as older releases, and keep the newest version as latest
        run: |
          for t in $(cat restore.txt); do
            gh release edit "$t" --draft=false --latest=false --tag "$t"
            test "$(gh release view "$t" --json isDraft --jq .isDraft)" = "false"
            gh release view "$t" --json tagName,isDraft,assets --jq '"\(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'
          done
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          gh release edit "$newest" --latest
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "latest: $latest"
          test "$latest" = "$newest"
