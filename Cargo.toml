[package]
name = "qoa"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
authors = ["GitHub: @planetryan"]
description = "QOA (Quantum Optical Assembly): an assembly language and simulator for qubits and optical modes"
license-file = "LICENSE"
# build.rs-k MPI-ren geruza konpilatzen du `mpi` ezaugarriarekin bakarrik (src/mpi_shim.c, mpicc-ekin)
build = "build.rs"

[dependencies]
# nukleoa: mihiztatzailea, simulagailua, cli
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: kalibrazioak (zarata-ereduak) bit berberekin irakurtzeko
serde_json = { version = "1.0", features = ["float_roundtrip"] }
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.9"
rayon = "1.10"
bincode = "1.3"

# `qoa run --gpu`: vulkan, exekuzioan kargatua (libvulkan ez da konpilatzeko behar)
ash = { version = "0.38", optional = true }
libloading = { version = "0.8", optional = true }

# `qoa visual` (audioa argitik, bideoa ffmpeg-ekin)
indicatif = "0.18"
realfft = "2.0"
# `qoa visual`-en argi-bidea (src/light.rs): mdct ortonormala fft konplexuarekin
rustfft = "6.4"

[features]
default = ["vulkan", "opencl"]
vulkan = ["dep:ash"]
# `qoa run --gpu` OpenCL bidez (AMD Instinct, NVIDIA, Intel, POCL): libOpenCL exekuzioan kargatzen da
opencl = ["dep:libloading"]
# `qoa run --mpi`: shot-ak MPI prozesuen artean (mpicc eta MPI liburutegi bat behar ditu)
mpi = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"

# kerr zulo beltzaren adibidea (examples/kerr.rs); bere probak `cargo test`-ekin exekutatzen dira
[[example]]
name = "kerr"
test = true

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "bandwidth"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["vulkan"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = "fat"
codegen-units = 1
