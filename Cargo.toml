[package]
name = "qoa"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
authors = ["GitHub: @planetryan"]
description = "QOA (Quantum Optical Assembly): an assembly language and simulator for qubits and optical modes"
license-file = "LICENSE"
# the old build.rs compiled hand-written assembly that nothing called; v0.4 has no build script
build = false

[dependencies]
# core: assembler, simulator, cli
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.9"
rayon = "1.10"
bincode = "1.3"

# `qoa run --gpu`: vulkan, exekuzioan kargatua (libvulkan ez da konpilatzeko behar)
ash = { version = "0.38", optional = true }

# `qoa visual` (audio-espektroaren bideoa)
hound = "3.5"
indicatif = "0.18"
realfft = "2.0"

[features]
default = ["vulkan"]
vulkan = ["dep:ash"]

[dev-dependencies]
criterion = "0.5"

# kerr zulo beltzaren adibidea (examples/kerr.rs); bere probak `cargo test`-ekin exekutatzen dira
[[example]]
name = "kerr"
test = true

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "bandwidth"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["vulkan"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = "fat"
codegen-units = 1
